name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SQUARE_ACCESS_TOKEN: dummy_token_for_ci_build
          SQUARE_LOCATION_ID: dummy_location_for_ci_build
          SQUARE_ENV: sandbox
          NEXT_PUBLIC_SITE_URL: https://sacredportalwellness.com

  lighthouse:
    name: Lighthouse
    needs: lint-and-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SQUARE_ACCESS_TOKEN: dummy_token_for_ci_build
          SQUARE_LOCATION_ID: dummy_location_for_ci_build
          SQUARE_ENV: sandbox
          NEXT_PUBLIC_SITE_URL: https://sacredportalwellness.com

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          SQUARE_ACCESS_TOKEN: dummy_token_for_ci_build
          SQUARE_LOCATION_ID: dummy_location_for_ci_build
          SQUARE_ENV: sandbox
          NEXT_PUBLIC_SITE_URL: https://sacredportalwellness.com

      - name: Upload Lighthouse Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-results
          path: app/.lighthouseci/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
